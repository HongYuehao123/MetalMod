// ---------------------------------------------------------------------------------------------
// MetalMod build configuration
// ---------------------------------------------------------------------------------------------
// STATUS: this file is NOT a working mod build.
//
// * fabric-loom is declared with `apply false`, so it never runs.
// * No Minecraft / mappings / fabric-loader dependency is declared. gradle.properties lists
//   minecraft_version / loader_version / fabric_version, but nothing consumes them.
// * There is no Gradle wrapper in this repository, so `./gradlew` does not exist.
//
// The authoritative build is `scripts/build_mod.sh`, which compiles the native library and then
// compiles the Java sources against the API stubs produced by scripts/generate_stubs.py.
//
// WARNING: because the Java sources are compiled against stubs, mixin targets and Minecraft
// method signatures are NOT validated against the real game. All mixin injections use
// `require = 0`, so a wrong signature is silently ignored rather than reported. See README.
//
// To make this a real mod build: apply fabric-loom, add the minecraft/mappings/fabric-loader
// dependencies for the actual target version, add the Gradle wrapper, and remove the stub step.
// ---------------------------------------------------------------------------------------------

plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'java'
}

group = 'net.metalmod'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_22
    targetCompatibility = JavaVersion.VERSION_22
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // Loom dependencies configured when running inside Loom
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

task compileNative(type: Exec) {
    description = 'Compiles the native Metal 4 library using CMake'
    workingDir = file('native')
    commandLine 'sh', '-c', 'cmake -B build -S . && cmake --build build --config Release'
    doLast {
        copy {
            from 'native/build/libmetalmod.dylib'
            into 'src/main/resources/natives'
        }
    }
}

processResources {
    dependsOn compileNative
}

test {
    useJUnitPlatform()
}
